name: Continuous Delivery

# Image publishing is disabled on this fork. The workflow stays so the
# name is recognizable, and it does not build or push.

on:
  workflow_dispatch:

jobs:
  disabled:
    name: Image publishing is disabled
    runs-on: ubuntu-latest
    steps:
      - name: Do not publish
        run: echo "Bussum does not publish container images from this repository."
